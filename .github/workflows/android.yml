name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate math library
        run: python3 tools/validate_problem_bank.py
      - name: Validate cat memes
        run: python3 tools/validate_cat_memes.py
      - name: Verify owner signature and checksums
        run: python3 tools/verify_assets.py
      - name: Unit-test non-repeating question selection
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Smoke-test stable release signing with a THROWAWAY CI key
        run: |
          set -euo pipefail
          keytool -genkeypair -alias mathgate-ci \
            -keyalg RSA -keysize 2048 -validity 1 -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/throwaway-ci.p12" \
            -storepass 'test-only-ci-key' -keypass 'test-only-ci-key' \
            -dname 'CN=CI signing smoke test' -noprompt
          export MATHGATE_KEYSTORE_PATH="$RUNNER_TEMP/throwaway-ci.p12"
          export MATHGATE_STORE_PASSWORD='test-only-ci-key'
          export MATHGATE_KEY_PASSWORD='test-only-ci-key'
          export MATHGATE_KEY_ALIAS='mathgate-ci'
          gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            app/build/outputs/apk/release/app-release.apk
          # This throwaway-signed APK is NOT uploaded or published.
      - uses: actions/upload-artifact@v4
        with:
          name: MathGate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
