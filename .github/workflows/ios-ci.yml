name: iOS source build check (simulator only)
on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native Xcode project
        run: cd ios && xcodegen generate
      - name: Build for simulator (no distribution signing)
        run: |
          xcodebuild -project ios/MathGateIOS.xcodeproj \
            -scheme MathGateIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Explain distribution scope
        run: echo "Simulator compilation is NOT an installable iPhone/TestFlight release; Family Controls distribution entitlement and Apple signing are required."
