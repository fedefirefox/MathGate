name: Publish stable-signed MathGate APK

on:
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'fedefirefox/MathGate' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate owner-signed data and cats
        run: |
          python3 tools/validate_problem_bank.py
          python3 tools/validate_cat_memes.py
          python3 tools/verify_assets.py
      - name: Check for permanent release signing identity
        id: signing
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.MATHGATE_SIGNING_BUNDLE_BASE64 }}
        run: |
          if [ -z "$SIGNING_BUNDLE_B64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No permanent signing key configured. No release will be published."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read signing identity from GitHub repository secret
        if: steps.signing.outputs.ready == 'true'
        env:
          SIGNING_BUNDLE_B64: ${{ secrets.MATHGATE_SIGNING_BUNDLE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, io, json, os, pathlib, zipfile
          from pathlib import Path
          secret = base64.b64decode(os.environ["SIGNING_BUNDLE_B64"], validate=True)
          assert len(secret) < 40_000
          bundle = zipfile.ZipFile(io.BytesIO(secret))
          assert set(bundle.namelist()) == {"mathgate-release.p12", "credentials.json"}
          credentials = json.loads(bundle.read("credentials.json"))
          assert set(credentials) == {"alias", "store_password", "key_password"}
          for key, value in credentials.items():
              assert isinstance(value, str) and 8 <= len(value) <= 128
          folder = Path(os.environ["RUNNER_TEMP"]) / "mathgate-signing"
          folder.mkdir(mode=0o700, exist_ok=True)
          signing_file = folder / "mathgate-release.p12"
          signing_file.write_bytes(bundle.read("mathgate-release.p12"))
          signing_file.chmod(0o600)
          mapping = {
              "MATHGATE_KEYSTORE_PATH": str(signing_file),
              "MATHGATE_STORE_PASSWORD": credentials["store_password"],
              "MATHGATE_KEY_PASSWORD": credentials["key_password"],
              "MATHGATE_KEY_ALIAS": credentials["alias"]
          }
          with open(os.environ["GITHUB_ENV"], "a") as env:
              for key, value in mapping.items():
                  assert "\n" not in value
                  print("::add-mask::" + value)
                  env.write(key + "=" + value + "\n")
          print("Stable private release key loaded without publishing it.")
          PY
      - name: Build permanently signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon assembleRelease
      - name: Verify signed APK and generate checksum
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          [ -n "$VERSION" ]
          APK="MathGate-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "MathGate-v${VERSION}.sha256"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish official same-key APK (Android user approval still required)
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" \
            "MathGate-v${VERSION}.apk" \
            "MathGate-v${VERSION}.sha256" \
            --target "$GITHUB_SHA" \
            --title "MathGate v$VERSION (stable-signed)" \
            --notes "Signed with the permanent MathGate release certificate. New update workflow: tap Update MathGate directly from GitHub in the app; Android will ask you to confirm installation. The FIRST transition from the old debug-signed v0.6.0 requires uninstalling it. Future releases using the same keystore can update in place. This release is not silently installed."
          echo "Public release available at https://github.com/fedefirefox/MathGate/releases/tag/v$VERSION"
